# Exception detection rules for the Knot Shore grocery platform.
#
# The value bands carry no day-of-week or seasonal adjustment, so each
# band has to span a store's natural daily variance over the whole
# window or it floods false positives on ordinary high-traffic days.
# The widths below are set from the measured envelope of the canonical
# negative universe (see each rule's comment), not from round numbers.
# A future seasonal-baseline rule could replace these static widths with
# empirical per-store-date expectations and tighten them considerably.
#
# Per-profile bands key off dim_stores.trade_area_profile. The three
# profiles below are the canonical set from the live sim engine seed
# config — every store_id in dim_stores must be one of these profiles.

rules:
  revenue_band:
    enabled: true
    band_pct: 0.60
    # expected value comes from dim_stores.base_daily_revenue.
    # Natural total_sales / base_daily_revenue over the negative
    # universe spans roughly [0.79, 1.58] across the two-year window
    # (weekend, holiday, and payday peaks drive the high tail). ±0.60
    # clears that envelope so only gross excursions fire; the old ±0.25
    # band was the single largest false-positive source.

  labor_pct_band:
    enabled: true
    bands_by_profile:
      suburban-family: { center: 0.105, half_width_pp: 0.05 }
      urban-dense:     { center: 0.115, half_width_pp: 0.05 }
      value-market:    { center: 0.120, half_width_pp: 0.05 }

  avg_ticket_band:
    enabled: true
    bands_by_profile:
      suburban-family: { center: 38.00, band_pct: 0.20 }
      urban-dense:     { center: 28.00, band_pct: 0.20 }
      value-market:    { center: 32.00, band_pct: 0.20 }

  transactions_band:
    enabled: true
    band_pct: 0.45
    # expected count = dim_stores.base_daily_revenue / avg_ticket_band.center_for_profile.
    # Natural transaction_count / expected over the negatives spans
    # roughly [0.78, 1.61] — the same wide envelope as revenue. The high
    # tail would justify a wider band, but the lower edge is deliberately
    # held at 0.55 (±0.45) so a store-day whose transactions collapse to
    # about half of normal still fires; a symmetric band can't both clear
    # the high tail and keep that sensitivity, which is the kind of
    # asymmetry a seasonal-baseline rule would resolve. A handful of
    # genuine high-traffic outliers remain flagged, well within budget.

  yoy_comp:
    enabled: true
    ratio_lower: 0.55
    ratio_upper: 1.40
    # current / T-365 sales ratio. Natural year-over-year ratio over the
    # negatives spans roughly [0.61, 1.35]; [0.55, 1.40] clears it. The
    # old [0.85, 1.25] band fired on ordinary year-over-year growth and
    # was a large false-positive source. Silently skipped when no T-365
    # row is present in the metrics frame.

  # Rolling-baseline rule. Unlike the bands above whose expected value
  # comes from dim_stores or a profile config, this rule learns its
  # expected value from the prior `window_days` observations for each
  # store. min_history_days counts PRIOR observations (current row
  # excluded) — a store's earliest evaluable day is its
  # (min_history_days + 1)th observation. Rows whose rolling stddev is
  # zero or NaN are silently skipped (z-score is undefined when recent
  # history is constant). Severity bucketing reads |z| directly:
  # info for 2.5 <= |z| < 3, warning for 3 <= |z| < 4, critical for
  # |z| >= 4.
  revenue_zscore_28d:
    enabled: true
    window_days: 28
    min_history_days: 14
    zscore_threshold: 2.5

  # Structural-integrity rule. Unlike the bands above it does not check a
  # value against an expected range; it checks the shape of the
  # department-grain metrics frame. A store-day fires when its department
  # row count is not expected_row_count, or when a department_id is
  # repeated within the store-day. Skipped entirely when no department
  # metrics frame is supplied to the detection run.
  department_coverage:
    enabled: true
    expected_row_count: 10
    detect_duplicates: true
    severity_level: warning

  # Gross-margin rule. Margin lives only at department grain, so this
  # rule reads the department frame and fires a store-day when any of its
  # departments has a gross_margin_pct outside center ± half_width. The
  # band [0.15, 0.62] sits outside the natural department-margin envelope
  # (roughly [0.26, 0.55] across the canonical) with headroom on both
  # sides: nothing legitimate runs below ~15% (that implies COGS above
  # 85% of net sales) or above ~62%, while the injected outliers sit at
  # 0.95 (COGS ~5% of net) and negative (COGS exceeding net). Severity
  # reuses the band ladder via severity_score = distance / half_width.
  # Skipped entirely when no department frame is supplied.
  gross_margin_band:
    enabled: true
    center: 0.385
    half_width: 0.235

  # Cross-grain reconciliation rule. Reads both grains: a store-day fires
  # when its department net_sales sum differs from the store-grain
  # total_sales by more than `tolerance` dollars. In clean data the two
  # grains agree to floating-point precision (largest residual ~1e-11),
  # and the smallest injected breach is ~$50, so $1.00 absorbs currency
  # rounding without masking any injected mismatch. Skipped entirely when
  # no department frame is supplied.
  department_reconciliation:
    enabled: true
    tolerance: 1.00
    severity_level: warning

severity:
  # severity_score = distance_from_band / band_half_width
  info_max: 1.0
  warning_max: 2.0
  # anything > warning_max is "critical"
